services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: glosscheck
      MYSQL_USER: glosscheck
      MYSQL_PASSWORD: glosscheck
      MYSQL_ROOT_PASSWORD: glosscheck_root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.5-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8086:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: glosscheck
      WORDPRESS_DB_USER: glosscheck
      WORDPRESS_DB_PASSWORD: glosscheck
      GLOSSCHECK_DEEPSEEK_API_KEY: ${GLOSSCHECK_DEEPSEEK_API_KEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8086');
        define('WP_SITEURL', 'http://localhost:8086');
    volumes:
      - wp_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: glosscheck
      WORDPRESS_DB_USER: glosscheck
      WORDPRESS_DB_PASSWORD: glosscheck
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content

volumes:
  wp_data:
  db_data:
